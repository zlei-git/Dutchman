<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#212121" />
            <stop offset="100%" stop-color="#000000" />
        </radialGradient>
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5A1F" />
            <stop offset="100%" stop-color="#FF8A50" />
        </linearGradient>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="800" height="550" rx="20" fill="url(#bgGrad)" />
    
    <!-- Subtle Modern Grid Lines -->
    <circle cx="400" cy="275" r="210" stroke="white" stroke-width="1" opacity="0.04" fill="none" />
    <circle cx="400" cy="275" r="300" stroke="white" stroke-width="1" opacity="0.03" fill="none" />
    <line x1="0" y1="410" x2="800" y2="410" stroke="white" stroke-width="1" opacity="0.06" />

    <!-- Brand Watermark in Background -->
    <text x="400" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="12" fill="white" opacity="0.05">WALKEN</text>

    <!-- Shoe Visual -->
    <g transform="translate(0, 15)">
                <!-- Outsole & Midsole -->
        <path d="M 100 360 C 130 385, 240 395, 380 395 C 520 395, 640 380, 710 355 C 695 340, 660 330, 610 335 C 540 340, 460 345, 380 345 C 280 345, 200 340, 130 330 C 110 335, 95 345, 100 360 Z" fill="#FFFFFF" filter="drop-shadow(0 12px 16px rgba(0,0,0,0.4))" />
        <path d="M 120 340 C 180 348, 280 352, 380 352 C 480 352, 580 345, 640 335 L 630 325 C 570 332, 470 338, 380 338 C 280 338, 190 335, 135 325 Z" fill="#00E5FF" />
        
        <!-- Shoe Upper Body -->
        <path d="M 125 325 C 115 300, 140 240, 220 220 C 280 205, 330 230, 370 200 C 410 170, 450 140, 520 150 C 560 155, 580 190, 570 230 C 580 250, 620 280, 670 310 C 685 320, 660 335, 620 332 C 540 336, 450 340, 380 340 C 270 340, 170 335, 125 325 Z" fill="#212121" />
        
        <!-- Athletic Overlay / Dynamic Sweep -->
        <path d="M 230 225 C 310 240, 380 290, 480 285 C 550 280, 600 300, 625 315 L 610 325 C 570 310, 520 300, 460 302 C 380 305, 300 260, 215 240 Z" fill="#00E5FF" />
        
        <!-- Collar & Tongue -->
        <path d="M 440 155 C 470 135, 515 140, 530 160 C 510 185, 475 205, 450 215 Z" fill="#000000" opacity="0.8" />
        
        <!-- Laces & Eyelets -->
        <line x1="380" y1="215" x2="420" y2="200" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="395" y1="235" x2="440" y2="220" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="410" y1="255" x2="460" y2="240" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
        <line x1="425" y1="275" x2="480" y2="260" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

        <!-- Heel Accent -->
        <path d="M 125 325 C 130 280, 160 250, 195 240 C 185 275, 175 310, 170 330 Z" fill="#00E5FF" opacity="0.85" />
        
        <!-- Air / Cushioning Pod -->
        <rect x="220" y="360" width="70" height="14" rx="7" fill="#00E5FF" opacity="0.75" />
        <rect x="310" y="362" width="70" height="14" rx="7" fill="#00E5FF" opacity="0.75" />
    </g>

    <!-- Product Badge Stamp -->
    <g transform="translate(60, 60)">
        <rect width="130" height="30" rx="15" fill="#FF5A1F" opacity="0.9" />
        <text x="65" y="19" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">WALKEN LAB</text>
    </g>

    <!-- Silhouette Model Label -->
    <text x="740" y="500" text-anchor="end" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="white" opacity="0.4" letter-spacing="2">VELOCITY NITRO</text>
</svg>