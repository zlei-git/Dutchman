<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
            <stop offset="0%" stop-color="#37474F" />
            <stop offset="100%" stop-color="#1A2024" />
        </radialGradient>
        <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF5A1F" />
            <stop offset="100%" stop-color="#FF8A50" />
        </linearGradient>
    </defs>
    
    <!-- Background Canvas -->
    <rect width="800" height="550" rx="20" fill="url(#bgGrad)" />
    
    <!-- Subtle Modern Grid Lines -->
    <circle cx="400" cy="275" r="210" stroke="white" stroke-width="1" opacity="0.04" fill="none" />
    <circle cx="400" cy="275" r="300" stroke="white" stroke-width="1" opacity="0.03" fill="none" />
    <line x1="0" y1="410" x2="800" y2="410" stroke="white" stroke-width="1" opacity="0.06" />

    <!-- Brand Watermark in Background -->
    <text x="400" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="76" letter-spacing="12" fill="white" opacity="0.05">WALKEN</text>

    <!-- Shoe Visual -->
    <g transform="translate(0, 15)">
                <!-- Sandal Base & Strap -->
        <path d="M 120 320 C 140 280, 240 270, 360 275 C 480 280, 640 290, 680 340 C 650 380, 520 395, 380 395 C 240 395, 130 370, 120 320 Z" fill="#263238" />
        <path d="M 110 335 C 130 295, 230 285, 360 290 C 490 295, 650 305, 690 355 C 670 410, 510 430, 360 430 C 210 430, 100 395, 110 335 Z" fill="#455A64" />
        <!-- Sandal Strap Arch -->
        <path d="M 280 310 C 290 200, 460 190, 500 315 C 460 325, 430 250, 390 240 C 350 230, 310 260, 280 310 Z" fill="#FF5A1F" opacity="0.95" />
        <path d="M 330 290 C 340 230, 430 220, 460 295" stroke="#455A64" stroke-width="6" stroke-linecap="round" fill="none" />
    </g>

    <!-- Product Badge Stamp -->
    <g transform="translate(60, 60)">
        <rect width="130" height="30" rx="15" fill="#FF5A1F" opacity="0.9" />
        <text x="65" y="19" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">WALKEN LAB</text>
    </g>

    <!-- Silhouette Model Label -->
    <text x="740" y="500" text-anchor="end" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="white" opacity="0.4" letter-spacing="2">EASY SLIDE</text>
</svg>